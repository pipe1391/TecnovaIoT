name=TecnovaIoT
version=1.4.0
author=Tecnova
maintainer=Tecnova <https://github.com/pipe1391/TecnovaIoT/issues>
sentence=Conecta un ESP32 a la plataforma IoT Tecnova por MQTT sobre WebSocket seguro (WSS).
paragraph=Maneja WiFi, la obtencion de credenciales via el webhook del dispositivo, la validacion TLS del broker, la reconexion automatica ante cortes, y el mapeo de variables del panel por nombre -- publicar un sensor o reaccionar a un comando queda reducido a un par de llamadas (setValue/onCommand), sin tocar MQTT ni certificados a mano. Los comandos del panel llegan a onCommand() con su tipo JSON: booleano para interruptores y botones, numero para deslizadores. Incluye manejo de consumo para proyectos a bateria: deepSleepSeconds() para sensores que solo publican, y enablePowerSave() para actuadores o dispositivos mixtos, que tienen que seguir alcanzables. Incluye tambien un modulo opcional (TecnovaProvisioning) para cargar las credenciales desde un portal cautivo en vez de escribirlas en el codigo.
category=Communication
url=https://github.com/pipe1391/TecnovaIoT
license=MIT
architectures=esp32
depends=ArduinoJson (>=6.19.4 && <7.0.0)
