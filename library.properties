name=TecnovaIoT
version=1.1.1
author=Tecnova
maintainer=Tecnova <soporte@ceetecnova.com>
sentence=Conecta un ESP32 a la plataforma IoT Tecnova (panel.ceetecnova.com) por MQTT sobre WebSocket seguro.
paragraph=Maneja WiFi, la obtencion de credenciales via el webhook del dispositivo, la validacion TLS del broker, la reconexion automatica ante cortes, y el mapeo de variables del panel por nombre -- publicar un sensor o reaccionar a un comando queda reducido a un par de llamadas (setValue/onCommand), sin tocar MQTT ni certificados a mano. Incluye un modulo opcional (TecnovaProvisioning) para cargar las credenciales desde un portal cautivo en vez de escribirlas en el codigo.
category=Communication
url=https://github.com/pipe1391/TecnovaIoT
architectures=esp32
depends=ArduinoJson
includes=TecnovaIoT.h
